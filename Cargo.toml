[workspace]
members = ["iwork2pdf", "iwork2pdf-cli", "iwork2pdf-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
iwork2pdf = { path = "iwork2pdf" }
flate2 = "1.1"
# Rasterising PDFs (pasted artwork, acceptance comparison); needs libpdfium at run time.
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "sync"] }
# CPU-bound parallelism.
rayon = "1.10"
# Drawing and the PDF backend (the same Skia SkiaSharp wraps). `textlayout` builds Skia with
# HarfBuzz, which the PDF backend needs to subset embedded fonts (without it every font, Apple Color
# Emoji's 180 MB included, is embedded whole).
skia-safe = { version = "0.87", features = ["pdf", "textlayout"] }
thiserror = "2.0"

[profile.release]
debug = 1
