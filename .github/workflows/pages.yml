# Builds the WebAssembly demo (iwork2pdf-wasm/web) and publishes it to GitHub Pages.
# Enable it once under Settings > Pages > Source: GitHub Actions.
# Runs on every push to main, and release.yml runs it again (on main) once a version tag is
# released, so the page names the version it was built from: the latest tag, plus the commits
# since it when main is ahead.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the page
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      # Pinned: src/sjlj.rs relies on Emscripten internals (setThrew, stack save/restore).
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - uses: Swatinem/rust-cache@v2
      - name: Fetch Nimbus Sans (not in the repository)
        run: ./fetch-nimbus-sans.sh
      - run: iwork2pdf-wasm/build-web.sh
      - name: Stamp the version
        run: |
          if tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null)"; then
            version="$(git describe --tags --match 'v*')"
            sed -i "/id=\"version\"/{s|/releases\"|/releases/tag/${tag}\"|; s|>dev<|>${version}<|}" \
              iwork2pdf-wasm/web/index.html
          fi
          grep 'id="version"' iwork2pdf-wasm/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iwork2pdf-wasm/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
