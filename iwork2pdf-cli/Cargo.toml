[package]
name = "iwork2pdf-cli"
description = "Command line front end of iwork2pdf: convert, batch, compare"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iwork2pdf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
# The compare cache.
flate2.workspace = true
# Progress bars for batch conversion and comparison.
indicatif = "0.17"
iwork2pdf.workspace = true
pdfium-render.workspace = true
rayon.workspace = true
skia-safe.workspace = true
thiserror.workspace = true
