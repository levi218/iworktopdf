[package]
name = "iwork2pdf-wasm"
description = "WebAssembly (Emscripten) entry point of iwork2pdf and its browser demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# No `pdfium` feature: native libraries cannot be loaded in the browser (pasted PDF artwork is skipped).
iwork2pdf = { path = "../iwork2pdf", default-features = false }
